name: Build and Deploy to K3s

on:
push:
branches:
- main

env:
IMAGE_NAME: temiayo/k3s-mission-control

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Log in to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Build and push image
    uses: docker/build-push-action@v6
    with:
      context: .
      push: true
      tags: |
        ${{ env.IMAGE_NAME }}:latest
        ${{ env.IMAGE_NAME }}:${{ github.sha }}


deploy:
needs: build
runs-on: [self-hosted, linux, x64, k3s]


steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Verify runner and cluster access
    run: |
      sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get nodes

  - name: Apply manifests
    run: |
      sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f k8s/deployment.yaml
      sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f k8s/service.yaml

  - name: Update deployment image
    run: |
      sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml set image deployment/mission-control mission-control=${{ env.IMAGE_NAME }}:${{ github.sha }}

  - name: Wait for rollout
    run: |
      sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml rollout status deployment/mission-control --timeout=180s

  - name: Show status
    run: |
      sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get deployments
      sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get pods
      sudo kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get svc

